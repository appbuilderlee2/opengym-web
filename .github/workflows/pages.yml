name: Deploy openGym Web PWA

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'catalogue/**'
      - 'scripts/catalogue/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build standalone PWA
        working-directory: frontend
        env:
          VITE_MOBILE: '1'
          VITE_WEB_LOCAL: '1'
        run: npm run build
      - name: Bundle exercise media
        run: node scripts/catalogue/stage-media.mjs frontend/dist
      - name: Verify published output
        run: |
          test -s frontend/dist/index.html
          test -s frontend/dist/manifest.json
          test -s frontend/dist/sw.js
          grep -q 'id="root"' frontend/dist/index.html
          grep -q 'assets/' frontend/dist/index.html
          if grep -qi 'self-hosted gym and body-weight tracker you actually own' frontend/dist/index.html; then
            echo 'ERROR: README was published instead of the React application'
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
